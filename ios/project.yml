name: TVRemote
options:
  bundleIdPrefix: io.github.mikachu1302
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.5"
    CURRENT_PROJECT_VERSION: "12"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TVRemoteCore:
    path: .
targets:
  TVRemote:
    type: application
    platform: iOS
    sources:
      - path: TVRemote
        excludes: ["Info.plist", "TVRemote.entitlements"]
    dependencies:
      - package: TVRemoteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikachu1302.tvremote
        PRODUCT_NAME: TVRemote
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: TVRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "icon_dracula icon_synthwave icon_catppuccin icon_gruvbox icon_tokyo icon_nord icon_amber icon_matrix icon_pride icon_pride_bezel icon_pride_light icon_pride_rainbow icon_pride_night icon_pride_big"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TVRemote/TVRemote.entitlements
    info:
      path: TVRemote/Info.plist
      properties:
        CFBundleDisplayName: TV Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIAppFonts: [VT323-Regular.ttf, FiraCode-VF.ttf]
        NSLocalNetworkUsageDescription: TV Remote talks to your TV or stick on your home network. Nothing leaves your network.
        NSBonjourServices: [_androidtvremote2._tcp]
        NSMicrophoneUsageDescription: The microphone is only used while you hold the mic button, to send your voice to the TV's search.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
  TVRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TVRemoteTests]
    dependencies:
      - target: TVRemote
      - package: TVRemoteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikachu1302.tvremote.tests
        GENERATE_INFOPLIST_FILE: YES
  TVRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TVRemoteUITests]
    dependencies:
      - target: TVRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikachu1302.tvremote.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TVRemote:
    build:
      targets:
        TVRemote: all
    test:
      targets: [TVRemoteTests, TVRemoteUITests]
